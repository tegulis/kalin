name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test (in-memory) and verify dependencies
        run: ./gradlew build --stacktrace
      - name: Format check
        run: ./gradlew ktfmtCheck

  engine-matrix:
    name: Engine matrix (${{ matrix.os }}, ${{ matrix.engine }}/${{ matrix.transport }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, engine: LOOM, transport: NIO }
          - { os: ubuntu-latest, engine: EVENT_LOOP, transport: NIO }
          - { os: ubuntu-latest, engine: EVENT_LOOP, transport: EPOLL }
          - { os: windows-latest, engine: LOOM, transport: NIO }
          - { os: windows-latest, engine: EVENT_LOOP, transport: NIO }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Test over real sockets
        run: ./gradlew :lib:test :testtools:test -Pkalin.testMode=REAL -Pkalin.engine=${{ matrix.engine }} -Pkalin.transport=${{ matrix.transport }}
